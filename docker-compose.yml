services:
  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  verify:
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      VERIFY_API_HOST: api
      VERIFY_API_PORT: "8000"
    command: ["python", "-m", "app.verify"]
    restart: "no"
